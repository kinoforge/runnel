name: runnel-dev
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: runnel
      POSTGRES_PASSWORD: runnel
      POSTGRES_DB: runnel
    ports: ["55432:5432"]
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: runnel
      MYSQL_DATABASE: runnel
    command: ["--skip-log-bin"]
    ports: ["53306:3306"]
  redis:
    image: redis:7.4.5-alpine
    ports: ["56379:6379"]
  valkey:
    image: valkey/valkey:8.1.3-alpine
    ports: ["56380:6379"]
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.32.0
    ulimits:
      memlock: -1
    command: ["--proactor_threads=2"]
    ports: ["56381:6379"]
