# runnel serve settings. Load with --config FILE or RUNNEL_CONFIG=FILE.
# Order: built-in defaults, this file, RUNNEL_* variables, command-line flags.
# Each key has a variable named after its path: server.max_body -> RUNNEL_SERVER_MAX_BODY.
# Exceptions: server.addr -> RUNNEL_ADDR, server.admin_token -> RUNNEL_ADMIN_TOKEN.
# A duration or number left at 0 uses the library default shown.

store: sqlite:runnel.db # postgres://..., mysql://..., redis://..., hybrid:/var/lib/runnel, memory:

log:
  format: text # text or json
  level: info  # debug, info, warn, error

server:
  addr: ":8700"
  admin_token: "" # at least 24 characters; prefer RUNNEL_ADMIN_TOKEN
  max_body: 0           # 4 MiB
  max_claim_wait: 0s    # 30s
  max_result_wait: 0s   # 60s
  retry_after: 0s       # 1s
  allow_http_callbacks: false
  read_header_timeout: 10s
  read_timeout: 1m
  write_timeout: 2m
  idle_timeout: 2m
  max_header_bytes: 65536
  shutdown_timeout: 15s
  drain_delay: 0s       # /readyz answers 503 this long before shutdown starts

maintainer:
  enabled: true
  interval: 0s    # 1s
  prune_every: 0s # 1m
  batch: 0        # 500
  archive: false
  retention:
    completed: 24h
    cancelled: 24h
    dead: 168h
    events: 24h
    undelivered: 168h

callbacks:
  enabled: true
  concurrency: 0 # 4
  timeout: 0s    # 10s
  allow_private: false

limits:
  max_payload: 1048576
  max_depends_on: 256
  max_meta: 32
  max_unique_key: 255
  max_callback_url: 2048

memory:
  heap_percent: 70 # of the container limit

tracing:
  enabled: false # spans over OTLP/HTTP; set OTEL_EXPORTER_OTLP_ENDPOINT and other OTEL_* variables

hybrid:
  sync: each # each, periodic or off; the store url's ?sync= wins
  sync_interval: 100ms
  snapshot_bytes: 67108864
  check_every: 1s
  # memory
  hot_percent: 25
  job_bytes: 300
  hot_jobs: 0 # 0: from hot_percent
  min_hot_jobs: 16384
  no_limit_hot_jobs: 1048576
  # finished jobs
  retire_after: 1s
  retire_every: 1s
  retire_batch: 4096
  # backlog
  spill_every: 100ms
  spill_batch: 4096
  refill_batch: 8192
  refill_ahead: 32768
  batch_bytes: 4194304
  max_refills: 8
  wake_batch: 65536
  # cold store
  cold_cache_bytes: 16777216
  cold_memtable_bytes: 8388608
  cold_bloom_bits: 10
