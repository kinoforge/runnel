name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=20s
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: small disk
        run: sudo mkdir /drill && sudo mount -t tmpfs -o size=96m tmpfs /drill && sudo chmod 1777 /drill
      - run: go test -tags drill -p 1 -count=1 -timeout 30m ./internal/drill
        env:
          RUNNEL_DRILL_DISK: /drill
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: runnel
          POSTGRES_PASSWORD: runnel
          POSTGRES_DB: runnel
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U runnel" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_ROOT_PASSWORD: runnel
          MYSQL_DATABASE: runnel
        ports: ["53306:3306"]
        options: --health-cmd "mysqladmin ping -prunnel" --health-interval 3s --health-retries 40
      redis:
        image: redis:7.4.5-alpine
        ports: ["56379:6379"]
      valkey:
        image: valkey/valkey:8.1.3-alpine
        ports: ["56380:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: dragonfly
        run: |
          docker run -d --name dragonfly -p 56381:6379 --ulimit memlock=-1 docker.dragonflydb.io/dragonflydb/dragonfly:v1.32.0 --proactor_threads=2
          sleep 5
      - run: make test-all
